/**
 * مؤسسة بلقاسم عطية - إعداد الاتصال
 * ضع رابط نشر Apps Script المنتهي بـ /exec فقط.
 */
window.BAYREN_CONFIG = Object.freeze({
  appName: 'مؤسسة بلقاسم عطية لأشغال البناء في مختلف مراحله',
  version: '1.3.0',
  designer: 'زغدي فاروق',
  apiUrl: 'https://script.google.com/macros/s/AKfycbyjc0yuyMfbkEZ7neRv396kQIXc-kj_UrzHqCMYaSCeZX8ZUWdxjpS2yJb5B5s0sL0t/exec',
  requestTimeoutMs: 90000
});


/**
 * اتصال مباشر بين واجهة HTML وخلفية Google Apps Script.
 */
const BayrenBridge = {
  async call(request) {
    const config = window.BAYREN_CONFIG || {};
    const url = config.apiUrl;
    if (!url) throw new Error('رابط Apps Script غير مضبوط.');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), Number(config.requestTimeoutMs || 90000));
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(request),
        signal: controller.signal
      });
      const result = await response.json();
      return result;
    } finally {
      clearTimeout(timer);
    }
  }
};

  async function api(action, payload = {}, showLoader = true) {
    if (showLoader) loading(true);
    try {
      const requestPayload = Object.assign({}, payload);
      if (!['login','status','logout'].includes(action)) requestPayload.branchId = state.branchId || 'ALL';
      const result = await BayrenBridge.call({ action, token: state.token, payload: requestPayload });
      if (!result || !result.ok) {
        const message = result && result.error ? result.error : 'حدث خطأ غير معروف.';
        if (/الجلسة|تسجيل الدخول/.test(message)) forceLogin();
        throw new Error(message);
      }
      return result.data;
    } finally {
      if (showLoader) loading(false);
    }
  }

  function loading(active) {
    document.getElementById('loading').classList.toggle('hidden', !active);
  }

  function toast(message, type = 'success') {
    const host = document.getElementById('toast');
    const item = document.createElement('div');
    item.className = 'toast-item' + (type === 'error' ? ' error' : '');
    item.textContent = message;
    host.appendChild(item);
    setTimeout(() => item.remove(), 3600);
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  }

  function money(value) {
    return new Intl.NumberFormat('ar-DZ', { maximumFractionDigits: 2 }).format(Number(value || 0)) + ' دج';
  }

  function has(permission) {
    return state.permissions.some(granted => {
      if (granted === '*') return true;
      if (granted === permission) return true;
      return granted.endsWith('.*') && permission.startsWith(granted.slice(0, -1));
    });
  }

  function statusBadge(value) {
    const text = String(value || '');
    const good = ['ACTIVE','PAID','DONE','RECEIVED','CONFIRMED','POSTED','COMPLETED'].includes(text);
    const bad = ['INACTIVE','CANCELLED','OVERDUE'].includes(text);
    return `<span class="badge ${good ? 'good' : bad ? 'bad' : 'warn'}">${esc(text || '-')}</span>`;
  }

  function optionLabel(value) {
    const labels = {
      GOODS:'سلعة', RAW_MATERIAL:'مادة أولية', FINISHED_PRODUCT:'منتج مصنّع', SERVICE:'خدمة',
      MANUFACTURE:'تصنيع منتج', PROJECT_CONSUMPTION:'استهلاك في مشروع',
      TRANSFER_OUT:'تحويل صادر', TRANSFER_IN:'تحويل وارد', PRODUCTION_CONSUME:'استهلاك للتصنيع',
      PRODUCTION_OUTPUT:'إنتاج منتج', PROJECT_USE:'استهلاك مشروع'
    };
    return labels[String(value || '')] || String(value || '');
  }


  function branchName(branchId) {
    const branch = state.branches.find(item => String(item.id) === String(branchId));
    return branch ? branch.name : (branchId ? 'فرع غير معروف' : '-');
  }

  function assignedBranchNames(value) {
    if (String(value || '') === '*') return 'كل الفروع';
    const ids = String(value || '').split(',').map(x => x.trim()).filter(Boolean);
    return ids.map(branchName).join('، ') || '-';
  }

  function setupBranchSelector() {
    const select = document.getElementById('branchSelector');
    if (!select) return;
    select.innerHTML = `<option value="ALL">كل الفروع المسموحة</option>${state.branches.map(branch => `<option value="${esc(branch.id)}">${esc(branch.name)} — ${esc(branch.code)}</option>`).join('')}`;
    select.value = state.branchId || 'ALL';
    if (![...select.options].some(option => option.value === select.value)) select.value = 'ALL';
    select.onchange = async () => {
      state.branchId = select.value;
      localStorage.setItem('bayren_erp_branch', state.branchId);
      state.cache = {};
      try {
        state.dashboard = await api('dashboard');
        await navigate(state.current);
      } catch (error) { toast(error.message, 'error'); }
    };
  }

  async function refreshBranchesFromServer() {
    const data = await api('list', { table: 'BRANCHES', options: { limit: 1000, orderBy: 'name', direction: 'asc' } }, false);
    state.branches = (data.rows || []).filter(branch => String(branch.status || 'ACTIVE').toUpperCase() === 'ACTIVE');
    if (state.branchId !== 'ALL' && !state.branches.some(branch => String(branch.id) === String(state.branchId))) {
      state.branchId = 'ALL';
      localStorage.setItem('bayren_erp_branch', state.branchId);
    }
    setupBranchSelector();
  }

  function requireSpecificBranch() {
    if (state.branchId && state.branchId !== 'ALL') return true;
    if (state.branches.length === 1) {
      state.branchId = state.branches[0].id;
      localStorage.setItem('bayren_erp_branch', state.branchId);
      setupBranchSelector();
      return true;
    }
    toast('اختر فرعًا محددًا من أعلى الصفحة قبل إضافة أو تنفيذ عملية.', 'error');
    return false;
  }

  function setSidebar(open) {
    const sidebar = document.querySelector('.sidebar');
    const scrim = document.getElementById('sidebarScrim');
    if (!sidebar || !scrim) return;
    sidebar.classList.toggle('open', Boolean(open));
    scrim.classList.toggle('show', Boolean(open));
    document.body.classList.toggle('nav-open', Boolean(open));
  }

  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    setSidebar(!(sidebar && sidebar.classList.contains('open')));
  }

  function closeSidebar() {
    setSidebar(false);
  }

  function setInstallButtonsVisible(visible) {
    ['installAppButton','installAppTopButton'].forEach(id => {
      const button = document.getElementById(id);
      if (button) button.classList.toggle('hidden', !visible);
    });
  }

  function setupInstallPrompt() {
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    setInstallButtonsVisible(!standalone);
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      state.installPrompt = event;
      setInstallButtonsVisible(true);
    });
    window.addEventListener('appinstalled', () => {
      state.installPrompt = null;
      setInstallButtonsVisible(false);
      toast('تم تثبيت اختصار التطبيق.');
    });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }

  async function installShortcut() {
    if (state.installPrompt) {
      state.installPrompt.prompt();
      await state.installPrompt.userChoice;
      state.installPrompt = null;
      return;
    }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    toast(ios
      ? 'من Safari اضغط زر المشاركة ثم اختر «إضافة إلى الشاشة الرئيسية».'
      : 'من قائمة المتصفح اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
  }

  function setupNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = NAV.filter(item => has(item[4])).map(item =>
      `<button class="nav-item ${state.current === item[0] ? 'active' : ''}" data-page="${item[0]}"><span>${item[1]}</span><span>${item[2]}</span></button>`
    ).join('');
    nav.querySelectorAll('.nav-item').forEach(button => button.addEventListener('click', () => navigate(button.dataset.page)));
  }

  function setHeader(page) {
    const item = NAV.find(x => x[0] === page) || NAV[0];
    document.getElementById('pageTitle').textContent = item[2];
    document.getElementById('pageSubtitle').textContent = item[3];
  }

  async function init() {
    document.getElementById('loginForm').addEventListener('submit', login);
    document.getElementById('menuButton').addEventListener('click', event => {
      event.stopPropagation();
      toggleSidebar();
    });
    document.getElementById('sidebarScrim').addEventListener('click', closeSidebar);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeSidebar();
        if (!document.getElementById('modal').classList.contains('hidden')) closeModal();
      }
    });
    setupInstallPrompt();
    if (!state.token) return showLogin();
    try {
      await bootstrap();
    } catch (error) {
      showLogin();
    }
  }

  async function login(event) {
    event.preventDefault();
    try {
      const data = await api('login', {
        email: document.getElementById('loginEmail').value.trim().toLowerCase(),
        password: document.getElementById('loginPassword').value
      });
      state.token = data.token;
      localStorage.setItem('bayren_erp_token', state.token);
      await bootstrap();
      toast('تم تسجيل الدخول بنجاح.');
    } catch (error) {
      toast(error.message, 'error');
    }
  }

  async function bootstrap() {
    const data = await api('bootstrap');
    state.user = data.user;
    state.permissions = data.permissions || [];
    state.branches = data.branches || [];
    state.branchId = data.activeBranchId || 'ALL';
    localStorage.setItem('bayren_erp_branch', state.branchId);
    state.dashboard = data.dashboard;
    document.getElementById('userName').textContent = data.user.name || data.user.email;
    document.getElementById('userRole').textContent = data.user.role;
    document.getElementById('userAvatar').textContent = (data.user.name || 'م').charAt(0);
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    setupBranchSelector();
    setupNav();
    navigate('dashboard');
  }

  function showLogin() {
    closeSidebar();
    document.getElementById('appView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
  }

  function forceLogin() {
    state.token = '';
    state.user = null;
    localStorage.removeItem('bayren_erp_token');
    showLogin();
  }

  async function logout() {
    try { await api('logout', {}, false); } catch (ignored) {}
    forceLogin();
  }

  async function navigate(page) {
    state.current = page;
    setupNav();
    setHeader(page);
    closeSidebar();
    const content = document.getElementById('content');
    content.innerHTML = '<div class="empty">جاري تحميل البيانات...</div>';
    try {
      if (page === 'dashboard') return renderDashboard();
      if (MODULES[page]) return renderGeneric(page);
      if (page === 'sales') return renderTransactions('sales');
      if (page === 'purchases') return renderTransactions('purchases');
      if (page === 'production') return renderProduction();
      if (page === 'inventory') return renderInventory();
      if (page === 'invoices') return renderInvoices();
      if (page === 'reports') return renderReports();
      content.innerHTML = '<div class="empty">القسم غير متاح.</div>';
    } catch (error) {
      content.innerHTML = `<div class="empty text-danger">${esc(error.message)}</div>`;
      toast(error.message, 'error');
    }
  }

  async function refreshCurrent() {
    state.cache = {};
    if (state.current === 'dashboard') state.dashboard = await api('dashboard');
    return navigate(state.current);
  }

  function openProfile() {
    if (!state.user) return;
    openModal('الحساب الشخصي', `
      <form id="profileForm" class="form-grid">
        <div class="field full">
          <label>البريد الإلكتروني</label>
          <input name="email" type="email" autocomplete="email" value="${esc(state.user.email || '')}" required>
        </div>
        <div class="field full">
          <label>كلمة المرور الحالية</label>
          <input name="currentPassword" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label>كلمة المرور الجديدة</label>
          <input name="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="اتركها فارغة دون تغيير">
        </div>
        <div class="field">
          <label>تأكيد كلمة المرور الجديدة</label>
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="أعد كتابة كلمة المرور">
        </div>
        <div class="form-actions full">
          <button class="btn primary" type="submit">حفظ التغييرات</button>
          <button class="btn ghost" type="button" onclick="App.closeModal()">إلغاء</button>
        </div>
      </form>`);
    document.getElementById('profileForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = Object.fromEntries(new FormData(event.target).entries());
      const email = String(form.email || '').trim().toLowerCase();
      const currentPassword = String(form.currentPassword || '');
      const newPassword = String(form.newPassword || '');
      const confirmPassword = String(form.confirmPassword || '');
      if (newPassword && newPassword !== confirmPassword) {
        toast('تأكيد كلمة المرور غير مطابق.', 'error');
        return;
      }
      if (newPassword && newPassword.length < 8) {
        toast('كلمة المرور الجديدة يجب أن تتكون من 8 أحرف على الأقل.', 'error');
        return;
      }
      try {
        const data = await api('updateProfile', { email, currentPassword, newPassword });
        if (data && data.user) state.user = data.user;
        closeModal();
        toast(newPassword ? 'تم تغيير كلمة المرور. سجّل الدخول من جديد.' : 'تم تحديث البريد الإلكتروني. سجّل الدخول من جديد.');
        setTimeout(forceLogin, 900);
      } catch (error) {
        toast(error.message, 'error');
      }
    });
  }

  function renderDashboard() {
    const d = state.dashboard;
    const m = d.metrics;
    document.getElementById('content').innerHTML = `
      <div class="cards">
        ${metric('💰','مبيعات الشهر',money(m.salesMonth),'إجمالي المبيعات')}
        ${metric('🛒','مشتريات الشهر',money(m.purchasesMonth),'إجمالي المشتريات')}
        ${metric('💸','مصاريف الشهر',money(m.expensesMonth),'المصاريف المسجلة')}
        ${metric('📥','مستحقات العملاء',money(m.receivables),'فواتير غير محصلة')}
        ${metric('📤','مستحقات الموردين',money(m.payables),'فواتير غير مدفوعة')}
        ${metric('👥','العملاء',m.customers,'عميل مسجل')}
        ${metric('📦','المنتجات',m.products,'صنف مسجل')}
        ${metric('⚠️','مخزون منخفض',m.lowStock,'صنف يحتاج متابعة')}
      </div>
      <div class="grid-2">
        <div class="panel">
          <div class="panel-header"><h3>آخر المبيعات</h3><button class="btn ghost small" onclick="App.navigate('sales')">عرض الكل</button></div>
          ${tableHtml(d.recentSales,[['branchId','الفرع'],['number','الرقم'],['date','التاريخ'],['customerName','العميل'],['total','الإجمالي'],['status','الحالة']],false)}
        </div>
        <div class="panel">
          <div class="panel-header"><h3>تنبيهات المخزون</h3><button class="btn ghost small" onclick="App.navigate('inventory')">المخزون</button></div>
          ${tableHtml(d.lowStock,[['branchId','الفرع'],['sku','SKU'],['name','المنتج'],['currentStock','المتوفر'],['minStock','الحد الأدنى']],false)}
        </div>
      </div>`;
  }

  function metric(icon, label, value, note) {
    return `<div class="metric-card"><div class="metric-head"><span>${esc(label)}</span><span class="metric-icon">${icon}</span></div><h3>${esc(value)}</h3><small>${esc(note)}</small></div>`;
  }

  async function loadTable(table, options = {}) {
    if (!options.force && state.cache[table]) return state.cache[table];
    const data = await api('list', { table, options: Object.assign({ limit: 1000 }, options) });
    state.cache[table] = data.rows;
    return data.rows;
  }

  async function renderGeneric(moduleKey) {
    const module = MODULES[moduleKey];
    const rows = await loadTable(module.table, { force: true });
    const canWrite = has(module.write);
    document.getElementById('content').innerHTML = `
      <div class="page-actions">
        <input class="search" id="tableSearch" placeholder="بحث داخل ${esc(module.title)}...">
        <div class="action-group">
          ${canWrite ? `<button class="btn primary" onclick="App.openRecordForm('${moduleKey}')">＋ إضافة</button>` : ''}
          <button class="btn ghost" onclick="App.exportCsv('${moduleKey}')">⇩ CSV</button>
        </div>
      </div>
      <div class="panel"><div id="genericTable">${genericTable(moduleKey, rows)}</div></div>`;
    document.getElementById('tableSearch').addEventListener('input', event => {
      const q = event.target.value.toLowerCase();
      const filtered = rows.filter(row => Object.values(row).some(value => String(value || '').toLowerCase().includes(q)));
      document.getElementById('genericTable').innerHTML = genericTable(moduleKey, filtered);
    });
  }

  function genericTable(moduleKey, rows) {
    const module = MODULES[moduleKey];
    return tableHtml(rows, module.columns, has(module.write), moduleKey);
  }

  function tableHtml(rows, columns, actions = false, moduleKey = '') {
    if (!rows || !rows.length) return '<div class="empty">لا توجد بيانات بعد.</div>';
    return `<div class="table-wrap"><table class="data-table"><thead><tr>${columns.map(c => `<th>${esc(c[1])}</th>`).join('')}${actions ? '<th>إجراءات</th>' : ''}</tr></thead><tbody>
      ${rows.map(row => `<tr>${columns.map(c => `<td>${formatCell(c[0], row[c[0]])}</td>`).join('')}${actions ? `<td><div class="row-actions"><button class="btn secondary small" onclick="App.openRecordForm('${moduleKey}','${row.id}')">تعديل</button><button class="btn danger small" onclick="App.removeRecord('${moduleKey}','${row.id}')">حذف</button></div></td>` : ''}</tr>`).join('')}
    </tbody></table></div>`;
  }

  function formatCell(key, value) {
    if (key === 'branchId') return esc(branchName(value));
    if (key === 'branchIds') return esc(assignedBranchNames(value));
    if (key === 'itemType' || key === 'operationType' || key === 'type') return esc(optionLabel(value));
    if (['total','subtotal','tax','paid','due','amount','balance','salePrice','costPrice','salary','budget','spent','sales','purchases','expenses','cashIn','cashOut','estimatedResult','totalMaterialCost'].includes(key)) return esc(money(value));
    if (key === 'status') return statusBadge(value);
    if (key === 'progress') return `${esc(value || 0)}%`;
    return esc(value || '-');
  }

  async function openRecordForm(moduleKey, id = '') {
    const module = MODULES[moduleKey];
    if (!id && module.branchScoped && !requireSpecificBranch()) return;
    const rows = await loadTable(module.table);
    const record = id ? rows.find(row => row.id === id) || {} : {};
    for (const field of module.fields) {
      if (field[2] === 'lookup') await loadTable(field[3]);
    }
    openModal(`${id ? 'تعديل' : 'إضافة'} — ${module.title}`, `
      <form id="recordForm" class="form-grid">
        ${module.branchScoped ? `<div class="field full"><label>الفرع</label><input value="${esc(branchName(record.branchId || state.branchId))}" disabled></div>` : ''}
        ${module.fields.map(field => fieldHtml(field, record[field[0]], Boolean(id))).join('')}
        <div class="form-actions full"><button class="btn primary" type="submit">حفظ</button><button class="btn ghost" type="button" onclick="App.closeModal()">إلغاء</button></div>
      </form>`);
    document.getElementById('recordForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(event.target);
      let data = Object.fromEntries(form.entries());
      module.fields.forEach(field => { if (field[2] === 'branchMulti') data[field[0]] = form.getAll(field[0]).join(','); });
      if (id) data.id = id;
      module.fields.forEach(field => {
        if (field[2] === 'number') data[field[0]] = Number(data[field[0]] || 0);
      });
      if (module.beforeSave) data = module.beforeSave(data);
      try {
        await api('save', { table: module.table, record: data });
        state.cache[module.table] = null;
        if (module.table === 'BRANCHES') await refreshBranchesFromServer();
        closeModal();
        toast('تم حفظ السجل.');
        navigate(moduleKey);
      } catch (error) { toast(error.message, 'error'); }
    });
  }

  function fieldHtml(field, value, editing) {
    const [name, label, type, arg] = field;
    const required = arg === true ? 'required' : '';
    const full = arg === 'full' || type === 'textarea' ? ' full' : '';
    let control = '';
    if (type === 'branchMulti') {
      const selected = String(value || '').split(',').map(x => x.trim()).filter(Boolean);
      control = `<div class="check-grid">${state.branches.map(branch => `<label class="check-option"><input type="checkbox" name="${name}" value="${esc(branch.id)}" ${selected.includes(branch.id) || String(value || '') === '*' ? 'checked' : ''}><span>${esc(branch.name)}</span></label>`).join('')}</div>`;
    } else if (type === 'select') {
      const options = (arg || []).map(option => `<option value="${esc(option)}" ${String(value || '') === option ? 'selected' : ''}>${esc(optionLabel(option))}</option>`).join('');
      control = `<select name="${name}" ${required}>${options}</select>`;
    } else if (type === 'textarea') {
      control = `<textarea name="${name}">${esc(value || '')}</textarea>`;
    } else if (type === 'lookup') {
      const rows = state.cache[arg] || [];
      control = `<select name="${name}"><option value="">— اختر —</option>${rows.map(row => `<option value="${row.id}" ${String(value || '') === row.id ? 'selected' : ''}>${esc(row.name || row.code)}</option>`).join('')}</select>`;
    } else {
      const placeholder = type === 'password' && editing ? 'اتركها فارغة دون تغيير' : '';
      control = `<input name="${name}" type="${type}" value="${type === 'password' ? '' : esc(value || '')}" ${required} placeholder="${placeholder}">`;
    }
    return `<div class="field${full}"><label>${esc(label)}</label>${control}</div>`;
  }

  function productChanged(select, kind) {
    const product = (state.cache.PRODUCTS || []).find(p => p.id === select.value);
    if (!product) return;
    const row = select.closest('tr');
    row.querySelector('.line-price').value = kind === 'sales' ? Number(product.salePrice || 0) : Number(product.costPrice || 0);
    row.querySelector('.line-tax').value = Number(product.taxRate || 0);
    recalcLines();
  }

  function recalcLines() {
    let subtotal = 0, tax = 0;
    document.querySelectorAll('#lineBody tr').forEach(row => {
      const qty = Number(row.querySelector('.line-qty').value || 0);
      const price = Number(row.querySelector('.line-price').value || 0);
      const rate = Number(row.querySelector('.line-tax').value || 0);
      const lineSub = qty * price;
      const lineTax = lineSub * rate / 100;
      subtotal += lineSub;
      tax += lineTax;
      row.querySelector('.line-total').textContent = money(lineSub + lineTax);
    });
    const sub = document.getElementById('subTotal');
    if (sub) sub.textContent = money(subtotal);
    const taxEl = document.getElementById('taxTotal');
    if (taxEl) taxEl.textContent = money(tax);
    const total = document.getElementById('grandTotal');
    if (total) total.textContent = money(subtotal + tax);
  }

        state.cache = {};
        closeModal();
        toast('تم تحويل الصنف وتسجيل حركة صادرة وواردة.');
        navigate('inventory');
      } catch (error) { toast(error.message, 'error'); }
    });
  }

  async function openStockAdjustment() {
    if (!requireSpecificBranch()) return;
    const products = (await loadTable('PRODUCTS')).filter(product => String(product.itemType || 'GOODS').toUpperCase() !== 'SERVICE');
    openModal('تسوية المخزون', `
      <form id="stockForm" class="form-grid">
        <div class="field full"><label>المنتج</label><select name="productId" required><option value="">— اختر —</option>${products.map(p => `<option value="${p.id}">${esc(p.sku)} — ${esc(p.name)} (${esc(p.currentStock || 0)})</option>`).join('')}</select></div>
        <div class="field"><label>الكمية (+ إضافة / - إخراج)</label><input name="qty" type="number" step="0.01" required></div>
        <div class="field"><label>المخزن</label><input name="warehouse" value="MAIN"></div>
        <div class="field full"><label>السبب</label><textarea name="notes" required></textarea></div>
        <div class="form-actions full"><button class="btn primary">تنفيذ</button><button class="btn ghost" type="button" onclick="App.closeModal()">إلغاء</button></div>
      </form>`);
    document.getElementById('stockForm').addEventListener('submit', async event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target).entries());
      data.qty = Number(data.qty || 0);
      try {
        await api('adjustStock', data);
        state.cache = {};
        closeModal(); toast('تم تحديث المخزون.'); navigate('inventory');
      } catch (error) { toast(error.message,'error'); }
    });
  }

  async function renderInvoices() {
    const invoices = await loadTable('INVOICES', { force: true });
    const payments = await loadTable('PAYMENTS', { force: true });
    document.getElementById('content').innerHTML = `
      <div class="page-actions"><input id="invoiceSearch" class="search" placeholder="بحث في الفواتير..."><button class="btn ghost" onclick="App.exportRows('INVOICES')">⇩ CSV</button></div>
      <div class="panel"><div id="invoiceTable">${invoiceTable(invoices)}</div></div>
      <div class="panel" style="margin-top:16px"><div class="panel-header"><h3>آخر المدفوعات</h3></div>${tableHtml(payments.slice(0,100),[['branchId','الفرع'],['date','التاريخ'],['partyName','الطرف'],['direction','الاتجاه'],['method','الطريقة'],['amount','المبلغ'],['reference','المرجع']])}</div>`;
    document.getElementById('invoiceSearch').addEventListener('input', event => {
      const q = event.target.value.toLowerCase();
      document.getElementById('invoiceTable').innerHTML = invoiceTable(invoices.filter(i => Object.values(i).some(v => String(v || '').toLowerCase().includes(q))));
    });
  }

  function invoiceTable(rows) {
    if (!rows.length) return '<div class="empty">لا توجد فواتير.</div>';
    return `<div class="table-wrap"><table class="data-table"><thead><tr><th>الفرع</th><th>الرقم</th><th>التاريخ</th><th>الطرف</th><th>النوع</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows.map(row => `<tr><td>${esc(branchName(row.branchId))}</td><td>${esc(row.number)}</td><td>${esc(row.date)}</td><td>${esc(row.partyName)}</td><td>${esc(row.partyType)}</td><td>${money(row.total)}</td><td>${money(row.paid)}</td><td>${money(row.due)}</td><td>${statusBadge(row.status)}</td><td><div class="row-actions">${has('accounting.write') && Number(row.due || 0) > 0 ? `<button class="btn secondary small" onclick="App.openPayment('${row.id}')">دفع</button>` : ''}${has('accounting.write') ? `<button class="btn ghost small" onclick="App.makePdf('${row.id}')">PDF</button>` : ''}${row.pdfUrl ? `<a class="btn ghost small" target="_blank" href="${esc(row.pdfUrl)}">فتح</a>` : ''}</div></td></tr>`).join('')}</tbody></table></div>`;
  }

  async function openPayment(invoiceId) {
    const invoice = (state.cache.INVOICES || []).find(i => i.id === invoiceId);
    openModal('تسجيل دفعة — ' + (invoice ? invoice.number : ''), `
      <form id="paymentForm" class="form-grid">
        <div class="field"><label>المبلغ المتبقي</label><input value="${esc(invoice ? invoice.due : 0)}" disabled></div>
        <div class="field"><label>المبلغ المدفوع</label><input name="amount" type="number" step="0.01" min="0.01" max="${esc(invoice ? invoice.due : 0)}" required></div>
        <div class="field"><label>التاريخ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>الطريقة</label><select name="method"><option>CASH</option><option>BANK</option><option>CARD</option><option>CHEQUE</option><option>OTHER</option></select></div>
        <div class="field"><label>المرجع</label><input name="reference"></div>
        <div class="field full"><label>ملاحظات</label><textarea name="notes"></textarea></div>
        <div class="form-actions full"><button class="btn primary">حفظ الدفعة</button><button class="btn ghost" type="button" onclick="App.closeModal()">إلغاء</button></div>
      </form>`);
    document.getElementById('paymentForm').addEventListener('submit', async event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target).entries());
      data.invoiceId = invoiceId;
      data.amount = Number(data.amount || 0);
      try {
        await api('recordPayment', data);
        state.cache = {};
        closeModal(); toast('تم تسجيل الدفعة.'); navigate('invoices');
      } catch (error) { toast(error.message,'error'); }
    });
  }

  async function makePdf(invoiceId) {
    try {
      const data = await api('invoicePdf', { invoiceId });
      state.cache.INVOICES = null;
      toast('تم إنشاء ملف PDF.');
      window.open(data.url, '_blank');
      navigate('invoices');
    } catch (error) { toast(error.message,'error'); }
  }

  const MONTH_NAMES = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  async function renderReports(year = '') {
    const requestedYear = String(year || state.reportYear || new Date().getFullYear());
    const r = await api('reports', { year: requestedYear });
    state.reportYear = r.selectedYear;
    state.reportData = r;
    localStorage.setItem('bayren_erp_report_year', state.reportYear);
    const annual = r.annual || {};
    const resultLabel = Number(annual.estimatedResult || 0) >= 0 ? 'النتيجة السنوية التقديرية' : 'العجز السنوي التقديري';
    const monthlyRows = (r.monthly || []).map(row => Object.assign({}, row, {
      monthName: MONTH_NAMES[Math.max(0, Number(row.month || 1) - 1)] || row.month
    }));
    document.getElementById('content').innerHTML = `
      <div class="page-actions">
        <div class="action-group" style="align-items:center">
          <strong>السنة المالية</strong>
          <select id="reportYearSelector" style="width:auto;min-width:130px">${(r.availableYears || []).map(item => `<option value="${esc(item)}" ${String(item) === String(r.selectedYear) ? 'selected' : ''}>${esc(item)}</option>`).join('')}</select>
        </div>
        <button class="btn ghost" onclick="App.exportAnnualResults()">⇩ تصدير النتائج السنوية</button>
      </div>
      <div class="report-grid">
        ${reportCard('مبيعات سنة ' + r.selectedYear,money(annual.sales))}
        ${reportCard('مشتريات سنة ' + r.selectedYear,money(annual.purchases))}
        ${reportCard('مصاريف سنة ' + r.selectedYear,money(annual.expenses))}
        ${reportCard(resultLabel,money(annual.estimatedResult))}
        ${reportCard('التحصيلات الداخلة',money(annual.cashIn))}
        ${reportCard('المدفوعات الخارجة',money(annual.cashOut))}
        ${reportCard('قيمة المخزون الحالية',money(r.inventoryValue))}
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="panel-header"><h3>النتائج حسب السنوات</h3></div>
        ${tableHtml(r.annualSummary || [],[['year','السنة'],['sales','المبيعات'],['purchases','المشتريات'],['expenses','المصاريف'],['cashIn','التحصيلات'],['cashOut','المدفوعات'],['estimatedResult','النتيجة التقديرية']])}
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="panel-header"><h3>نتائج الفروع لسنة ${esc(r.selectedYear)}</h3></div>
        ${tableHtml(r.branchSummary || [],[['branchName','الفرع'],['sales','المبيعات'],['purchases','المشتريات'],['expenses','المصاريف'],['cashIn','التحصيلات'],['cashOut','المدفوعات'],['estimatedResult','النتيجة التقديرية']])}
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="panel-header"><h3>التفصيل الشهري لسنة ${esc(r.selectedYear)}</h3></div>
        ${tableHtml(monthlyRows,[['monthName','الشهر'],['sales','المبيعات'],['purchases','المشتريات'],['expenses','المصاريف'],['cashIn','التحصيلات'],['cashOut','المدفوعات'],['estimatedResult','النتيجة التقديرية']])}
      </div>
      <div class="panel" style="margin-top:16px"><div class="panel-header"><h3>أعلى الأرصدة المخزنية الحالية</h3></div>${tableHtml(r.topProducts,[['branchId','الفرع'],['sku','SKU'],['name','المنتج'],['currentStock','الرصيد'],['costPrice','التكلفة'],['salePrice','سعر البيع']])}</div>
      <div class="panel" style="margin-top:16px"><div class="panel-body"><strong>ملاحظة محاسبية:</strong><p class="muted">النتيجة التقديرية = المبيعات − المشتريات − المصاريف المسجلة. وهي نتيجة تسييرية داخلية لا تعوض الميزانية أو الحسابات القانونية، ولا تشمل تلقائيًا الاهتلاك أو الضرائب أو الرواتب غير المسجلة كمصاريف.</p></div></div>`;
    document.getElementById('reportYearSelector').addEventListener('change', event => renderReports(event.target.value));
  }

  function exportAnnualResults() {
    const data = state.reportData;
    if (!data || !data.annualSummary) {
      toast('لا توجد نتائج سنوية لتصديرها.', 'error');
      return;
    }
    const rows = data.annualSummary.map(row => ({
      'السنة': row.year,
      'المبيعات': row.sales,
      'المشتريات': row.purchases,
      'المصاريف': row.expenses,
      'التحصيلات الداخلة': row.cashIn,
      'المدفوعات الخارجة': row.cashOut,
      'النتيجة التقديرية': row.estimatedResult
    }));
    downloadText(`annual-results-${new Date().toISOString().slice(0,10)}.csv`, rowsToCsv(rows));
  }

  function reportCard(label, value) {
    return `<div class="report-card"><span class="muted">${esc(label)}</span><strong>${esc(value)}</strong></div>`;
  }

  function openModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modalBody').innerHTML = '';
  }

  function rowsToCsv(rows) {
    if (!rows || !rows.length) return '';
    const headers = Object.keys(rows[0]).filter(key => !key.startsWith('_'));
    const quote = value => `"${String(value == null ? '' : value).replace(/"/g,'""')}"`;
    return '\uFEFF' + [headers.map(quote).join(','), ...rows.map(row => headers.map(h => quote(row[h])).join(','))].join('\n');
  }

  function downloadText(filename, content, mime = 'text/csv;charset=utf-8') {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }

  async function exportRows(table) {
    const rows = await loadTable(table);
    downloadText(`${table}-${new Date().toISOString().slice(0,10)}.csv`, rowsToCsv(rows));
  }

  async function exportCsv(moduleKey) {
    return exportRows(MODULES[moduleKey].table);
  }

  return {
    init, login, logout, navigate, refreshCurrent, openRecordForm, removeRecord,
    openTransaction, addLine, productChanged, recalcLines, openStockTransfer, openStockAdjustment,
    renderProduction, openProduction, addMaterialLine, materialChanged, recalcMaterials, submitProduction,
    openPayment, makePdf, openModal, closeModal, exportRows, exportCsv, exportAnnualResults,
    openProfile, installShortcut
  };
})();

document.addEventListener('DOMContentLoaded', App.init);

  </script>
</body>
</html>
